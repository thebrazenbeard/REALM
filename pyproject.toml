[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realm-engine"
version = "0.1.0"
description = "Local-first, persistent text-world engine prototype"
requires-python = ">=3.11"

[project.scripts]
realm = "realm.cli:main"
realm-build = "realm.builder:main"

[tool.setuptools.packages.find]
where = ["src"]
